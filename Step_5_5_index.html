<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Submitting Your Report</title>

    <link rel="stylesheet" href="Step_5_5_style.css" />
    <script defer src="Step_5_5_script.js?v=2"></script>
  </head>

  <body>
    <main>
      <div
        class="spinner-stage"
        id="spinnerStage"
        role="status"
        aria-label="Submitting your report"
      >
        <!--
          The FixIt logo brought in hgere to be animated
        -->
      </div>

      <p class="submitting-label">Submitting your report&hellip;</p>

      <blockquote class="quote" id="quoteBox" aria-live="polite">
        <p class="quote-text" id="quoteText">
          Loading a little inspiration&hellip;
        </p>
        <footer class="quote-author" id="quoteAuthor"></footer>
      </blockquote>
    </main>
  </body>
</html>
