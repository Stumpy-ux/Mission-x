<!-- /* ====== Coded By Emily ====== -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Step 4 - Is there any supporting evidence? | FixIt</title>

    <link rel="stylesheet" href="Step_4_style.css" />
    <script defer src="Step_4_script.js"></script>
  </head>

  <body>

    <main>
      
      <!-- Page header -->
      <header class="header">
        <img 
          src="assets/fixit-logo.svg" 
          alt="FixIt" 
          class="logo" 
        />

        <div class="page-title">
          <h1>
            Step 4 of 5: <br/>
            Is there any supporting evidence?
          </h1>
        </div>
      </header>

      <!-- File input -->
      <section class="file-input-container" id="fileInputContainer">

        <!-- Empty state -->
        <div class="file-input-text" id="emptyState">

          <div class="file-input-icon">
            <img src="assets/attach-file-add.svg" alt="">
          </div>

          <h2>No files selected yet</h2>

          <p>
            Take photos on-site or attach files from your device
          </p>

        </div>


        <!-- Upload buttons -->
        <section class="file-upload-section">

          <div class="file-input-button">

            <button
              id="takePhotoButton"
              type="button"
              >
              <img src="assets/photo-camera.svg" alt="">
              Take Photo
            </button>


            <button
              id="attachPhotoButton"
              type="button"
              >
              <img src="assets/photo-library.svg" alt="">
              Photo Library
            </button>


            <button
              id="attachFileButton"
              type="button"
              >
              <img src="assets/attach-file.svg" alt="">
              Browse Files
            </button>

          </div>


          <p class="file-requirements">
            JPG, PNG, PDF, DOCX up to 10 MB
          </p>

        </section>

      </section>


      <!-- Hidden file inputs -->

      <!-- Camera -->
      <input
        type="file"
        id="cameraInput"
        accept="image/*"
        capture="environment"
        hidden
      >


      <!-- Photo Library -->
      <input
        type="file"
        id="photoInput"
        accept="image/*"
        hidden
      >


      <!-- Browse Files -->
      <input
        type="file"
        id="fileInput"
        accept=".jpg,.jpeg,.png,.pdf,.docx"
        hidden
      >


    
      <!-- File status summary -->

      <section 
        class="file-status-container" 
        id="fileStatusContainer" 
        hidden
        >
          
        <div class="file-status-summary">

          <button
            class="status-button attached-button"
            type="button"
            >
            <span id="attachedCount">0</span>
            Attached
          </button>


          <button
            class="status-button failed-button"
            type="button"
            >
            <img src="assets/failedButton.svg" alt="">

            <span id="failedCount">0</span>
            Failed
          </button>

        </div>


        <div class="file-status">
          <!-- Uploading card -->

          <div
            class="file-state"
            id="fileState"
            hidden
            >

            <div class="file-info">

              <img
                id="filePreview"
                class="file-preview"
                src="assets/photo-placeholder.svg"
                alt="Photo preview"
              >


              <div class="file-details">

                <p id="fileName" class="file-name"></p>

                <p class="upload-status" id="uploadStatus">
                  Uploading...
                </p>

              </div>


              <div class="file-actions">

                <span class="progress-percent">
                  0%
                </span>


                <button
                  id="removeButton"
                  class="remove-button"
                  type="button"
                  aria-label="Remove file"
                  >
                  <img src="assets/delete.svg" alt="">
                </button>

              </div>

            </div>

          </div>


          <!-- Uploaded -->

          <div
            class="file-state uploaded-state"
            id="uploadedState"
            hidden
            >

            <div class="file-info">

              <img
                id="uploadedPreview"
                class="file-preview"
                src="assets/photo-placeholder.svg"
                alt="Uploaded photo"
              >


              <div class="file-details">

                <p id="uploadedFileName" class="file-name"></p>

                <p id="uploadedStatus" class="uploaded-status">

                  <img
                    src="assets/success.svg"
                    alt=""
                    class="success-icon"
                  >

                  Uploaded

                </p>

              </div>


              <div class="file-actions">

                <button
                  id="previewButton"
                  class="action-button"
                  type="button"
                  aria-label="Preview file"
                  >
                  <img
                    src="assets/preview.svg"
                    alt=""
                  >
                </button>


                <button
                  id="uploadedRemoveButton"
                  class="remove-button"
                  type="button"
                  aria-label="Remove file"
                  >
                  <img src="assets/delete.svg" alt="">
                </button>

              </div>

            </div>

          </div>


          <!-- Failed -->

          <div
            class="file-state failed-state"
            id="failedState"
            hidden
          >

            <div class="file-info">

              <img
                id="failedPreview"
                class="file-preview"
                src="assets/photo-placeholder.svg"
                alt="Failed photo"
              >


              <div class="file-details">

                <p id="failedFileName" class="file-name"></p>

                <p id="failedStatus" class="failed-status">

                  <img
                    src="assets/failure.svg"
                    alt=""
                    class="failure-icon"
                  >

                  10 MB file limit exceeded

                </p>

              </div>


              <div class="file-actions">

                <button
                  id="failedRemoveButton"
                  class="remove-button"
                  type="button"
                  aria-label="Remove file"
                >
                  <img src="assets/delete.svg" alt="">
                </button>

              </div>
            </div>

          </div>

        </div>

      </section>

    </main>

    <!-- Step navigation -->
    <nav
      class="navigation-buttons"
      aria-label="Step navigation"
      >

      <button 
        type="button"
        class="back-button"
        aria-label="Back"
        onclick="window.location.href = 'Step_3_index.html'"
        >
        <img 
          src="assets/arrow-left.svg" 
          alt="" 
          aria-hidden="true"
        />
      </button>

      <button
        type="button"
        class="next-button"
        onclick="window.location.href = 'Step_5_index.html'"
        >
        <span>Next</span>
        <img 
          src="assets/arrow-right.svg" 
          alt="" 
          aria-hidden="true"
        />
      </button>

    </nav>

  </body>

</html>
